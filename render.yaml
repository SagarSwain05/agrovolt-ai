services:
  - type: web
    name: agrovolt-backend
    runtime: node
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
      - key: FRONTEND_URL
        value: https://agrovolt-ai.vercel.app
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: AGMARKNET_API_KEY
        sync: false
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: ROBOFLOW_MODEL_ID
        sync: false
      - key: ROBOFLOW_API_URL
        sync: false
      # Gemini key pool (comma-separated) — conversational Sahayak, STT, Odia TTS, translation.
      - key: GEMINI_API_KEYS
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Optional: TWILIO_*, WHATSAPP_*, BHASHINI_*, MQTT_* (see README)
